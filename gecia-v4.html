<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GecIA 🇦🇴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#FF8C00,#ffffff,#228B22);color:#000;min-height:100vh;padding:20px;animation:bgShift 20s infinite}
@keyframes bgShift{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(10deg)}}
.app{max-width:600px;margin:0 auto;animation:slideIn 0.8s}
@keyframes slideIn{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
h1{color:#FF8C00;text-align:center;margin-bottom:10px;font-size:40px;font-weight:900;text-shadow:0 0 20px rgba(255,140,0,0.5)}
.flag{font-size:36px;margin-left:10px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.subtitle{text-align:center;color:#333;font-size:15px;margin-bottom:8px;font-weight:600}
.author{text-align:center;color:#228B22;font-size:13px;margin-bottom:30px;font-style:italic;font-weight:700}
#chat{background:rgba(255,255,255,0.9);border-radius:20px;padding:25px;min-height:500px;margin-bottom:25px;border:3px solid #FF8C00;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
.msg{margin:18px 0;padding:18px;border-radius:20px;max-width:85%;line-height:1.8;animation:popIn 0.5s;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
@keyframes popIn{from{transform:scale(0.7);opacity:0}to{transform:scale(1);opacity:1}}
.user{background:linear-gradient(135deg,#FF8C00,#FFA500);color:#fff;float:right;clear:both;font-weight:700;border:2px solid #FF8C00}
.ai{background:linear-gradient(135deg,#228B22,#006400);color:#fff;clear:both;border-left:5px solid #FF8C00}
b{color:#FF6600;font-weight:800}
ul{margin:15px 0;padding-left:25px}
li{margin:10px 0}
.q{display:inline-block;padding:12px 20px;margin:8px;background:rgba(34,139,34,0.2);border:2px solid #228B22;border-radius:25px;font-size:14px;cursor:pointer;transition:all 0.3s;font-weight:600;color:#228B22}
.q:hover{background:rgba(34,139,34,0.4);transform:scale(1.08);border-color:#FF8C00}
#inp{width:75%;padding:18px;border-radius:30px;border:2px solid #228B22;background:#fff;color:#000;font-size:16px;outline:none;transition:all 0.3s}
#inp:focus{border-color:#FF8C00;box-shadow:0 0 15px rgba(255,140,0,0.5)}
#btn{width:22%;padding:18px;border-radius:30px;border:none;background:linear-gradient(135deg,#FF8C00,#FFA500);color:#fff;font-weight:800;cursor:pointer;font-size:16px;transition:all 0.3s}
#btn:hover{transform:scale(1.08);box-shadow:0 0 20px rgba(255,140,0,0.6)}
.moon{position:fixed;top:30px;right:30px;font-size:35px;animation:glow 3s infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 15px rgba(255,140,0,0.8));transform:scale(1)}50%{filter:drop-shadow(0 0 30px rgba(255,140,0,1));transform:scale(1.1)}}
</style>
</head>
<body>
<div class="moon">🌙</div>
<div class="app">
<h1>GecIA<span class="flag">🇦🇴</span></h1>
<div class="subtitle">Aprende, cria e constrói o teu futuro</div>
<div class="author">Criado por George Waldir Ventura</div>
<div id="chat"></div>
<div style="text-align:center">
<span class="q" onclick="ask('Inglês')">🌐 Inglês</span>
<span class="q" onclick="ask('História de Angola')">🇦🇴 História</span>
<span class="q" onclick="ask('Negócio')">💡 Negócio</span>
<span class="q" onclick="ask('Programação')">💻 Código</span>
</div>
<div style="text-align:center;margin-top:20px">
<input type="text" id="inp" placeholder="Escreve a tua pergunta...">
<button id="btn" onclick="send()">Enviar</button>
</div>
</div>
<script>
const c=document.getElementById('chat');
let topic='';
function add(t,u){
const d=document.createElement('div');
d.className='msg '+(u?'user':'ai');
d.innerHTML=t;
c.appendChild(d);
c.scrollTop=c.scrollHeight;
}
function n(t){return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function r(t){
const v=n(t);

// LUBANGO (deteta em QUALQUER frase)
if(v.includes('lubango')||v.includes('huila')||v.includes('sá da bandeira')){
return '<b>🇦🇴 LUBANGO — HUÍLA</b><br><br><b>LOCALIZAÇÃO:</b><br>• Província: Huíla<br>• Região: Sul de Angola<br>• Distância de Luanda: ~760 km<br>• Altitude: 1760 metros<br><br><b>HISTÓRIA:</b><br>• <b>Fundada:</b> Década de 1880 (colonos portugueses)<br>• Nome original: Sá da Bandeira<br>• Renomeada: Lubango (pós-independência, 1975)<br><br><b>ECONOMIA:</b><br>• Agricultura (milho, feijão, batata)<br>• Pecuária (gado, ovelhas)<br>• Turismo (Serra da Leba, Tundavala)<br><br><b>TURISMO:</b><br>• Serra da Leba (estrada em zig-zag)<br>• Cristo Rei<br>• Fenda da Tundavala<br>• Museu Regional<br><br><b>💡 Queres saber mais?</b>';
}

// INGLÊS
if(v.includes('ingles')||v.includes('english')||v.includes('aprender ingles')||v.includes('falar ingles')){
topic='ingles';
return '<b>🌐 INGLÊS — LÍNGUA GLOBAL</b><br><br><b>SAUDAÇÕES:</b><br>• Hello = Olá<br>• Good morning = Bom dia<br>• Good afternoon = Boa tarde<br>• How are you? = Como estás?<br>• I am fine = Estou bem<br>• Thank you = Obrigado<br>• Please = Por favor<br><br><b>NÚMEROS:</b><br>• One, Two, Three, Four, Five<br>• Six, Seven, Eight, Nine, Ten<br><br><b>CORES:</b><br>• Red, Blue, Green, Yellow<br>• Black, White, Orange<br><br><b>💡 PRÁTICA:</b> Escreve uma frase!';
}

// HISTÓRIA DE ANGOLA
if(v.includes('historia')&&v.includes('angola')){
topic='historia';
return '<b>🇦🇴 HISTÓRIA DE ANGOLA</b><br><br><b>PRÉ-COLONIAL:</b><br>• Reinos: Congo, Ndongo, Matamba<br>• Rainha Nzinga Mbande (1583-1663)<br><br><b>COLONIZAÇÃO (1483-1961):</b><br>• 1483: Diogo Cão chega<br>• Tráfico de escravos<br><br><b>INDEPENDÊNCIA:</b><br>• 11 de Novembro de 1975<br>• Agostinho Neto: 1º Presidente<br><br><b>GUERRA CIVIL:</b><br>• 1975-2002<br>• Paz em 2002<br><br><b>💡 Queres saber mais?</b>';
}

// NEGÓCIO
if(v.includes('negocio')||v.includes('ideia')||v.includes('empreender')||v.includes('ganhar dinheiro')){
topic='negocio';
return '<b>💡 NEGÓCIOS PARA ANGOLA</b><br><br><b>1️⃣ ENTREGAS:</b><br>• 500-1000 Kz/entrega<br>• Meta: 75-150 mil Kz/mês<br><br><b>2️⃣ REVENDA:</b><br>• Luanda → Lubango<br>• Lucro: 30-50%<br><br><b>3️⃣ DIGITAL:</b><br>• Chatbots, sites<br>• 10-50 mil Kz/projeto<br><br><b>💡 Qual queres detalhar?</b>';
}

// PROGRAMAÇÃO
if(v.includes('programacao')||v.includes('codigo')||v.includes('javascript')||v.includes('html')||v.includes('python')){
topic='programacao';
return '<b>💻 PROGRAMAÇÃO</b><br><br>HTML: Estrutura de sites<br>CSS: Estilo e cores<br>JavaScript: Interatividade<br>Python: IA e dados<br>Node.js: Servidores<br><br><b>💡 Qual queres aprender?</b>';
}

// ANGOLA (geral)
if(v.includes('angola')){
return '<b>🇦🇴 ANGOLA</b><br><br>Capital: Luanda<br>População: ~35 milhões<br>Independência: 11 Nov 1975<br>Províncias: 18<br>Língua: Português<br>Moeda: Kwanza (AOA)<br><br><b>💡 O que queres saber?</b>';
}

// SAUDAÇÃO
if(v.includes('ola')||v.includes('oi')||v.includes('bom dia')||v.includes('boa tarde')){
return '<b>🌙 Olá! Sou GecIA 🇦🇴</b><br><br>Posso ajudar com:<br>• 📚 Inglês, História<br>• 💡 Negócios<br>• 💻 Programação<br>• 🇦🇴 Angola (cidades, províncias)<br><br><b>O que queres aprender?</b>';
}

// AGRADECIMENTO
if(v.includes('obrigado')||v.includes('valeu')||v.includes('fixe')){
return '<b>💙 Sempre!</b> 🇦🇴🌙';
}

// ADEUS
if(v.includes('adeus')||v.includes('tchau')||v.includes('ate logo')){
return '<b>👋 Até logo!</b> Volta sempre! 🇦🇴';
}

// PADRÃO
return '<b>🤔 Interessante!</b><br><br>Conta mais. Estou aqui para ajudar.';
}
function ask(t){add(t,1);setTimeout(()=>add(r(t),0),400);}
function send(){const v=document.getElementById('inp').value;if(!v.trim())return;ask(v);document.getElementById('inp').value='';}
add('<b>🌙 Olá! Sou GecIA 🇦🇴</b><br><br>Aprende, cria e constrói o teu futuro.<br><br><b>Criado por George Waldir Ventura</b><br><br>Como posso ajudar?',0);
</script>
</body>
</html>
