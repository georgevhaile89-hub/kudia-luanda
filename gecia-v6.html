<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GecIA 🇦🇴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#1e3c72,#2a5298,#FF8C00);color:#fff;min-height:100vh;padding:20px}
.app{max-width:650px;margin:0 auto}
h1{color:#FFD700;text-align:center;margin-bottom:10px;font-size:42px;font-weight:900;text-shadow:0 0 25px rgba(255,215,0,0.6)}
.flag{font-size:38px;margin-left:10px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.subtitle{text-align:center;color:#fff;font-size:16px;margin-bottom:8px;font-weight:600}
.author{text-align:center;color:#FFD700;font-size:14px;margin-bottom:30px;font-style:italic;font-weight:700}
#chat{background:rgba(0,0,0,0.7);border-radius:25px;padding:30px;min-height:550px;margin-bottom:25px;border:3px solid rgba(255,255,255,0.2);box-shadow:0 15px 50px rgba(0,0,0,0.5)}
.msg{margin:20px 0;padding:20px;border-radius:20px;max-width:85%;line-height:1.9;animation:slideIn 0.5s;box-shadow:0 5px 20px rgba(0,0,0,0.3)}
@keyframes slideIn{from{transform:translateX(-30px);opacity:0}to{transform:translateX(0);opacity:1}}
.user{background:linear-gradient(135deg,#FF8C00,#FFA500);color:#000;float:right;clear:both;font-weight:700;border:2px solid #FFD700}
.ai{background:linear-gradient(135deg,#2E8B57,#006400);color:#fff;clear:both;border-left:5px solid #FFD700}
b{color:#FFD700;font-weight:800}
ul{margin:15px 0;padding-left:25px}
li{margin:10px 0}
.q{display:inline-block;padding:13px 22px;margin:8px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);border-radius:28px;font-size:14px;cursor:pointer;font-weight:600;color:#fff;transition:all 0.3s}
.q:hover{background:rgba(255,255,255,0.3);transform:scale(1.08);border-color:#FFD700}
#inp{width:75%;padding:18px;border-radius:30px;border:2px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;font-size:16px;outline:none}
#inp:focus{border-color:#FFD700;box-shadow:0 0 20px rgba(255,215,0,0.5)}
#btn{width:22%;padding:18px;border-radius:30px;border:none;background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;font-weight:800;cursor:pointer}
.book{position:fixed;top:25px;left:25px;font-size:32px;animation:float 3s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="book">📚</div>
<div class="app">
<h1>GecIA<span class="flag">🇦🇴</span></h1>
<div class="subtitle">Aprende, cria e constrói o teu futuro</div>
<div class="author">Criado por George Waldir Ventura</div>
<div id="chat"></div>
<div style="text-align:center">
<span class="q" onclick="ask('Inglês')">🌐 Inglês</span>
<span class="q" onclick="ask('História de Angola')">🇦🇴 História</span>
<span class="q" onclick="ask('Povos africanos')">👥 Povos</span>
<span class="q" onclick="ask('Receitas')">🍳 Receitas</span>
<span class="q" onclick="ask('Londres')">🇬🇧 Londres</span>
</div>
<div style="text-align:center;margin-top:20px">
<input type="text" id="inp" placeholder="Escreve a tua pergunta...">
<button id="btn" onclick="send()">Enviar</button>
</div>
</div>
<script>
const c=document.getElementById('chat');
function add(t,u){
const d=document.createElement('div');
d.className='msg '+(u?'user':'ai');
d.innerHTML=t;
c.appendChild(d);
c.scrollTop=c.scrollHeight;
}
function n(t){return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function r(t){
const v=n(t);

// LONDRES
if(v.includes('londres')||v.includes('london')||v.includes('inglaterra')||v.includes('reino unido')){
return '<b>🇬🇧 LONDRES / INGLATERRA</b><br><br><b>Capital:</b> Londres (Reino Unido)<br><b>População:</b> ~9 milhões (cidade), ~67 milhões (país)<br><b>Língua:</b> Inglês<br><b>Moeda:</b> Libra Esterlina (GBP)<br><br><b>História:</b><br>• Fundada pelos romanos (43 AD) como Londinium<br>• Centro do Império Britânico (século XIX-XX)<br>• Capital global de finanças, cultura, educação<br><br><b>Pontos turísticos:</b><br>• Big Ben, Parlamento, London Eye<br>• Torre de Londres, Buckingham Palace<br>• British Museum, Tate Modern<br>• Hyde Park, Thames River<br><br><b>Clima:</b><br>• Temperado oceânico<br>• Verão: 18-25°C<br>• Inverno: 2-8°C<br>• Chuvoso durante o ano<br><br><b>Economia:</b><br>• Finanças, turismo, educação, tecnologia<br>• Uma das cidades mais importantes do mundo';
}

// POVOS AFRICANOS - HERERO
if(v.includes('herero')){
return '<b>👥 POVOS HERERO</b><br><br><b>Localização:</b><br>• Namíbia (principalmente)<br>• Sul de Angola (província da Cunene)<br><br><b>População:</b> ~250.000<br><br><b>História:</b><br>• Povo pastor de origem Bantu<br>• Chegaram à região no século XVI<br>• Resistência contra colonização alemã (1904-1908)<br>• Genocídio Herero (primeiro do século XX)<br><br><b>Cultura:</b><br>• Pastores de gado (riqueza = cabeças de gado)<br>• Vestes tradicionais: mulheres usam vestidos longos estilo vitoriano e chapéus em forma de chifres<br>• Língua: Otjiherero<br><br><b>Religião:</b><br>• Cristianismo e crenças tradicionais<br>• Culto aos antepassados<br><br><b>Tradições:</b><br>• Cerimónias de iniciação<br>• Festival de Mahero (celebração cultural)';
}

// POVOS KHOISAN
if(v.includes('khoisan')||v.includes('koisan')||v.includes('bosquimano')||v.includes('san')){
return '<b>👥 POVOS KHOISAN (SAN/BOSQUIMANOS)</b><br><br><b>Localização:</b><br>• Deserto do Kalahari (Botswana, Namíbia)<br>• Sul de Angola (Cunene, Cuando Cubango)<br><br><b>População:</b> ~100.000<br><br><b>História:</b><br>• Povos mais antigos da humanidade<br>• Habitantes originais da África Austral<br>• Estilo de vida: caçadores-recoletores<br><br><b>Língua:</b><br>• Línguas Khoisan (cliques: ǀ, ǁ, ǃ, ǂ)<br>• Uma das famílias linguísticas mais antigas<br><br><b>Cultura:</b><br>• Arte rupestre (pinturas em cavernas)<br>• Conhecimento profundo da natureza<br>• Medicina tradicional com plantas<br><br><b>Estilo de vida:</b><br>• Caça com arco e flecha<br>• Recolha de frutos, raízes, mel<br>• Vida nómada ou semi-nómada<br><br><b>Ameaças:</b><br>• Perda de terras tradicionais<br>• Discriminação<br>• Perda de cultura e língua';
}

// POVOS DE ANGOLA
if(v.includes('ovimbundu')||v.includes('umbundu')||v.includes('povos')&&v.includes('angola')){
return '<b>👥 POVOS DE ANGOLA</b><br><br><b>Principais grupos étnicos:</b><br><br><b>1. Ovimbundu (37%)</b><br>• Províncias: Huambo, Bié, Benguela<br>• Língua: Umbundu<br>• Economia: Agricultura, comércio<br><br><b>2. Ambundu/Kimbundu (25%)</b><br>• Províncias: Luanda, Bengo, Malanje<br>• Língua: Kimbundu<br>• Economia: Comércio, serviços<br><br><b>3. Bakongo (14%)</b><br>• Províncias: Zaire, Uíge<br>• Língua: Kikongo<br>• História: Antigo Reino do Congo<br><br><b>4. Chokwe (12%)</b><br>• Províncias: Lunda Norte, Lunda Sul<br>• Arte: Máscaras, esculturas<br><br><b>5. Nganguela, Nhaneca, Mbunda</b><br>• Províncias: Huíla, Cuando Cubango<br><br><b>Unidade nacional:</b><br>• Língua oficial: Português<br>• Todos falam português além da língua materna';
}

// RECEITAS
if(v.includes('receita')||v.includes('culinaria')||v.includes('comida')||v.includes('cozinhar')||v.includes('muamba')||v.includes('funge')||v.includes('calulu')){
return '<b>🍳 RECEITAS DE CULINÁRIA ANGOLANA</b><br><br><b>MUAMBA DE GALINHA</b><br><b>Ingredientes:</b><br>• 1 galinha cortada em pedaços<br>• 200ml óleo de palma (dendém)<br>• 1 cebola<br>• 3 dentes de alho<br>• 2 tomates<br>• 1 pimento<br>• Sal, pimenta a gosto<br><br><b>Preparação:</b><br>1. Tempere a galinha com sal, alho, pimenta<br>2. Frite a galinha no óleo de palma<br>3. Adicione cebola, tomate, pimento<br>4. Cozinhe em fogo baixo 30-40 min<br>5. Sirva com funge<br><br><b>FUNGE DE BOMBÓ</b><br><b>Ingredientes:</b><br>• 500g farinha de bombó (mandioca)<br>• 1L água<br><br><b>Preparação:</b><br>1. Ferva a água<br>2. Adicione farinha aos poucos<br>3. Mexa até ficar consistente<br>4. Sirva quente com muamba<br><br><b>CALULU DE PEIXE</b><br><b>Ingredientes:</b><br>• 1kg peixe (carapau, pescada)<br>• 2 tomates, 1 cebola<br>• 1 berinjela, 1 abóbora<br>• Óleo de palma, sal<br><br><b>Preparação:</b><br>1. Tempere e frite o peixe<br>2. Cozinhe vegetais com óleo de palma<br>3. Junte tudo e cozinhe 20 min<br><br><b>💡 Queres mais receitas?</b>';
}

// CLIMA
if(v.includes('clima')||v.includes('temperatura')||v.includes('chuva')||v.includes('tempo')){
return '<b>🌤️ CLIMA DE ANGOLA</b><br><br><b>Tipos de clima:</b><br><br><b>1. Tropical (Norte):</b><br>• Luanda, Zaire, Uíge<br>• Temperatura: 22-30°C<br>• Chuva: Novembro-Abril<br>• Seca: Maio-Outubro<br><br><b>2. Temperado (Centro-Sul):</b><br>• Huíla, Huambo, Benguela<br>• Temperatura: 15-25°C<br>• Mais fresco devido à altitude<br><br><b>3. Desértico (Sul):</b><br>• Namibe, Cuando Cubango<br>• Temperatura: 20-35°C<br>• Pouca chuva<br>• Deserto do Namibe<br><br><b>Estações:</b><br>• <b>Chuvosa:</b> Novembro-Março<br>• <b>Seca:</b> Abril-Outubro<br><br><b>Temperaturas médias:</b><br>• Luanda: 24°C (média anual)<br>• Lubango: 18°C<br>• Huambo: 19°C';
}

// INGLÊS
if(v.includes('ingles')||v.includes('english')){
return '<b>🌐 INGLÊS</b><br><br><b>Saudações:</b><br>• Hello = Olá<br>• Good morning = Bom dia<br>• How are you? = Como estás?<br>• Thank you = Obrigado<br><br><b>Números:</b><br>• One, Two, Three, Four, Five<br>• Six, Seven, Eight, Nine, Ten<br><br><b>Cores:</b><br>• Red, Blue, Green, Yellow<br>• Black, White, Orange<br><br><b>💡 Prática:</b> Escreve uma frase!';
}

// HISTÓRIA DE ANGOLA
if(v.includes('historia')&&v.includes('angola')){
return '<b>🇦🇴 HISTÓRIA DE ANGOLA</b><br><br><b>Pré-colonial:</b><br>• Reinos: Congo, Ndongo, Matamba<br>• Rainha Nzinga Mbande (1583-1663)<br><br><b>Colonização (1483-1961):</b><br>• 1483: Diogo Cão<br>• Tráfico de escravos<br><br><b>Independência:</b><br>• 11 de Novembro de 1975<br>• Agostinho Neto: 1º Presidente<br><br><b>Guerra Civil:</b><br>• 1975-2002<br>• Paz em 2002';
}

// ANGOLA (geral)
if(v.includes('angola')){
return '<b>🇦🇴 ANGOLA</b><br><br>Capital: Luanda<br>População: ~35 milhões<br>Independência: 11 Nov 1975<br>Províncias: 18<br>Língua: Português<br>Moeda: Kwanza (AOA)<br><br><b>💡 O que queres saber?</b>';
}

// LUBANGO
if(v.includes('lubango')||v.includes('huila')){
return '<b>🇦🇴 LUBANGO / HUÍLA</b><br><br>Província: Huíla<br>Região: Sul<br>Altitude: 1760m<br>Distância de Luanda: ~760 km<br><br><b>História:</b> Fundada nos anos 1880<br><br><b>Turismo:</b> Serra da Leba, Cristo Rei, Fenda da Tundavala<br><br><b>Economia:</b> Agricultura, pecuária';
}

// BENGUELA
if(v.includes('benguela')){
return '<b>🇦🇴 BENGUELA</b><br><br>Província: Benguela<br>Região: Centro-Litoral<br>População: ~600.000<br><br><b>História:</b> Fundada em 1617<br><br><b>Economia:</b> Pescas, agricultura, comércio<br><br><b>Praias:</b> Morena, Caó, Baía Farta';
}

// NEGÓCIO
if(v.includes('negocio')||v.includes('ideia')||v.includes('empreender')){
return '<b>💡 NEGÓCIOS</b><br><br>1. Entregas: 500-1000 Kz<br>2. Revenda: 30-50% lucro<br>3. Digital: Chatbots, 10-50 mil Kz<br><br><b>💡 Qual queres detalhar?</b>';
}

// PROGRAMAÇÃO
if(v.includes('programacao')||v.includes('codigo')){
return '<b>💻 PROGRAMAÇÃO</b><br><br>HTML: Sites<br>CSS: Estilo<br>JavaScript: Interatividade<br>Python: IA<br>Node.js: Servidores<br><br><b>💡 Qual queres aprender?</b>';
}

// SAUDAÇÃO
if(v.includes('ola')||v.includes('oi')){
return '<b>🌙 Olá! Sou GecIA 🇦🇴</b><br><br>Posso ajudar com:<br>• 📚 História (Angola, África, Mundo)<br>• 👥 Povos africanos<br>• 🍳 Receitas de culinária<br>• 🌤️ Clima e geografia<br>• 🌐 Inglês<br>• 💡 Negócios<br>• 💻 Programação<br><br><b>O que queres aprender?</b>';
}

// AGRADECIMENTO
if(v.includes('obrigado')||v.includes('valeu')){
return '<b>💙 Sempre!</b> 🇦🇴📚';
}

// ADEUS
if(v.includes('adeus')||v.includes('tchau')){
return '<b>👋 Até logo!</b> 🇦🇴';
}

// PADRÃO
return '<b>🤔 Interessante!</b><br><br>Conta mais. Estou aqui para ajudar com história, povos, receitas, clima, geografia, inglês, negócios e programação.';
}
function ask(t){add(t,1);setTimeout(()=>add(r(t),0),400);}
function send(){const v=document.getElementById('inp').value;if(!v.trim())return;ask(v);document.getElementById('inp').value='';}
add('<b>🌙 Olá! Sou GecIA 🇦🇴📚</b><br><br>Aprende, cria e constrói o teu futuro.<br><br><b>Criado por George Waldir Ventura</b><br><br>Posso ajudar com história, povos africanos, receitas, clima, geografia, inglês, negócios e programação.<br><br><b>O que queres aprender?</b>',0);
</script>
</body>
</html>
