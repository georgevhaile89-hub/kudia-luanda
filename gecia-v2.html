<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GecIA PRO 🇦🇴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#000,#CC092F,#FFCD00);color:#fff;min-height:100vh;padding:20px;animation:bgShift 20s infinite}
@keyframes bgShift{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(15deg)}}
.app{max-width:600px;margin:0 auto;animation:slideIn 0.8s}
@keyframes slideIn{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
h1{color:#FFCD00;text-align:center;margin-bottom:10px;font-size:40px;font-weight:900;text-shadow:0 0 30px rgba(255,205,0,0.7)}
.flag{font-size:36px;margin-left:10px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.subtitle{text-align:center;color:#fff;font-size:15px;margin-bottom:8px;font-weight:500}
.author{text-align:center;color:#FFCD00;font-size:13px;margin-bottom:30px;font-style:italic;font-weight:600}
#chat{background:rgba(0,0,0,0.6);border-radius:20px;padding:25px;min-height:500px;margin-bottom:25px;border:2px solid rgba(255,255,255,0.2);box-shadow:0 10px 40px rgba(0,0,0,0.5)}
.msg{margin:18px 0;padding:18px;border-radius:20px;max-width:85%;line-height:1.8;animation:popIn 0.5s;box-shadow:0 5px 20px rgba(0,0,0,0.3)}
@keyframes popIn{from{transform:scale(0.7);opacity:0}to{transform:scale(1);opacity:1}}
.user{background:linear-gradient(135deg,#FFCD00,#FFA500);color:#000;float:right;clear:both;font-weight:700;border:2px solid #FFCD00}
.ai{background:linear-gradient(135deg,#CC092F,#8B0000);color:#fff;clear:both;border-left:5px solid #FFCD00}
b{color:#FFCD00;font-weight:800}
ul{margin:15px 0;padding-left:25px}
li{margin:10px 0}
.q{display:inline-block;padding:12px 20px;margin:8px;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);border-radius:25px;font-size:14px;cursor:pointer;transition:all 0.3s;font-weight:600}
.q:hover{background:rgba(255,255,255,0.3);transform:scale(1.08);border-color:#FFCD00}
#inp{width:75%;padding:18px;border-radius:30px;border:2px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.5);color:#fff;font-size:16px;outline:none;transition:all 0.3s}
#inp:focus{border-color:#FFCD00;box-shadow:0 0 15px rgba(255,205,0,0.5)}
#btn{width:22%;padding:18px;border-radius:30px;border:none;background:linear-gradient(135deg,#FFCD00,#FFA500);color:#000;font-weight:800;cursor:pointer;font-size:16px;transition:all 0.3s}
#btn:hover{transform:scale(1.08);box-shadow:0 0 20px rgba(255,205,0,0.6)}
.moon{position:fixed;top:30px;right:30px;font-size:35px;animation:glow 3s infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 15px rgba(255,255,255,0.8));transform:scale(1)}50%{filter:drop-shadow(0 0 30px rgba(255,255,255,1));transform:scale(1.1)}}
</style>
</head>
<body>
<div class="moon">🌙</div>
<div class="app">
<h1>GecIA<span class="flag">🇦🇴</span></h1>
<div class="subtitle">Aprende, cria e constrói o teu futuro</div>
<div class="author">Criado por George Waldir Ventura</div>
<div id="chat"></div>
<div style="text-align:center">
<span class="q" onclick="ask('Inglês')">🌐 Inglês</span>
<span class="q" onclick="ask('História de Angola')">🇦🇴 História</span>
<span class="q" onclick="ask('Negócio')">💡 Negócio</span>
<span class="q" onclick="ask('Programação')">💻 Código</span>
</div>
<div style="text-align:center;margin-top:20px">
<input type="text" id="inp" placeholder="Escreve a tua pergunta...">
<button id="btn" onclick="send()">Enviar</button>
</div>
</div>
<script>
const c=document.getElementById('chat');
let topic='';
function add(t,u){
const d=document.createElement('div');
d.className='msg '+(u?'user':'ai');
d.innerHTML=t;
c.appendChild(d);
c.scrollTop=c.scrollHeight;
}
function n(t){return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function r(t){
const v=n(t);
if(v.includes('ingles')||v.includes('english')){topic='ingles';return '<b>🌐 INGLÊS</b><br><br>Hello=Olá, Good morning=Bom dia, How are you?=Como estás?, I am fine=Estou bem, Thank you=Obrigado<br><br>Números: One, Two, Three, Four, Five<br><br>Cores: Red, Blue, Green, Yellow, Black, White<br><br><b>💡 Prática:</b> Escreve uma frase!';}
if(v.includes('historia')&&v.includes('angola')){topic='historia';return '<b>🇦🇴 HISTÓRIA DE ANGOLA</b><br><br>Pré-colonial: Reinos Congo, Ndongo, Matamba<br>Rainha Nzinga Mbande (1583-1663)<br><br>Colonização: 1483-1961<br>Independência: 11 Nov 1975<br>Agostinho Neto: 1º Presidente<br><br>Guerra Civil: 1975-2002<br><br><b>💡 Queres saber mais?</b>';}
if(v.includes('negocio')||v.includes('ideia')){topic='negocio';return '<b>💡 NEGÓCIOS</b><br><br>1. Entregas: 500-1000 Kz, meta 75-150 mil Kz/mês<br>2. Revenda: Luanda→Lubango, 30-50% lucro<br>3. Digital: Chatbots, 10-50 mil Kz/projeto<br><br><b>💡 Qual queres detalhar?</b>';}
if(v.includes('programacao')||v.includes('codigo')){topic='programacao';return '<b>💻 PROGRAMAÇÃO</b><br><br>HTML: Sites<br>CSS: Estilo<br>JavaScript: Interatividade<br>Python: IA<br>Node.js: Servidores<br><br><b>💡 Qual queres aprender?</b>';}
if(v.includes('angola')){return '<b>🇦🇴 ANGOLA</b><br><br>Capital: Luanda<br>População: 35 milhões<br>Independência: 11 Nov 1975<br>Províncias: 18<br><br><b>💡 O que queres saber?</b>';}
if(v.includes('ola')||v.includes('oi')){return '<b>🌙 Olá! Sou GecIA 🇦🇴</b><br><br>Posso ajudar com Inglês, História, Negócios, Programação, Angola<br><br><b>O que queres aprender?</b>';}
if(v.includes('obrigado')||v.includes('valeu')){return '<b>💙 Sempre!</b> 🇦🇴🌙';}
if(v.includes('adeus')||v.includes('tchau')){return '<b>👋 Até logo!</b> Volta sempre! 🇦🇴';}
return '<b>🤔 Interessante!</b><br><br>Conta mais. Estou aqui para ajudar.';
}
function ask(t){add(t,1);setTimeout(()=>add(r(t),0),400);}
function send(){const v=document.getElementById('inp').value;if(!v.trim())return;ask(v);document.getElementById('inp').value='';}
add('<b>🌙 Olá! Sou GecIA 🇦🇴</b><br><br>Aprende, cria e constrói o teu futuro.<br><br><b>Criado por George Waldir Ventura</b><br><br>Como posso ajudar?',0);
</script>
</body>
</html>
